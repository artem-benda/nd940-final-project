[versions]
android_gradle_plugin = "4.0.1"
core = "1.16.0"
constraint_layout = "2.2.1"
compat = "1.7.0"
glide = "4.12.0"
gradle = "8.9.2"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
hiltDagger = "2.56.1"
hilt = "1.2.0"
kotlin_coroutines = "1.3.7"
lifecycle = "2.8.7"
moshi = "1.9.3"
navigation = "2.8.9"
navigationSafeArgsGradlePlugin = "2.8.9"
retrofit = "2.9.0"
okhttp = "4.9.1"
recyclerview = "1.4.0"
multidex = "2.0.1"
material = "1.12.0"
junit = "4.13.2"
ext_junit = "1.2.1"
espresso = "3.6.1"
paging = "3.3.6"
room = "2.7.1"
timber = "5.0.1"
legacySupportV4 = "1.0.0"
lifecycleLivedataKtx = "2.8.7"
workRuntimeKtx = "2.10.1"

[libraries]
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
hilt-android-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hiltDagger" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "compat"}
material = { module = "com.google.android.material:material", version.ref = "material" }
constraint-layout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint_layout" }

legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupportV4" }
lifecycle-livedata-ktx = { module = 'androidx.lifecycle:lifecycle-livedata-ktx', version.ref = "lifecycleLivedataKtx" }
navigation-safe-args-gradle-plugin = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "navigationSafeArgsGradlePlugin" }
work-runtime-ktx = { module = 'androidx.work:work-runtime-ktx', version.ref = "workRuntimeKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-ext = { module = "androidx.test.ext:junit", version.ref = "ext_junit" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Hilt
hilt-dagger-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltDagger" }
hilt-work = { module = 'androidx.hilt:hilt-work', version.ref = "hilt" }
hilt-compiler = { module = 'androidx.hilt:hilt-compiler', version.ref = "hilt" }

# For tests
dagger-hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hiltDagger" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hiltDagger" }

# Multidex
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }

# ViewModel and LiveData
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Navigation
navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Moshi
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-adapters = { module = "com.squareup.moshi:moshi-adapters", version.ref = "moshi" }


# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Retrofit with Moshi Converter
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }

# Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

# RecyclerView
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# Paging
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# Room Paging 3 Integration (only in 2.4.x)
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }

# Timber logging
timber-logging = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# KSP
ksp-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]

